name: Deploy API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    uses: platform/central-pipeline/.github/workflows/helm-deploy.yml@main
    with:
      aws-region: us-east-1
      ecr-repo: demo-observability-api
      helm-repo: demo-observability-helm
      eks-cluster: demo-cluster
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_EKS_SECRET }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

