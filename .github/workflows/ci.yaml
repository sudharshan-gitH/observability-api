name: Deploy API

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    uses: your-org/devops-central-pipeline/.github/workflows/deploy.yml@main
    with:
      aws-region: ap-south-1
      ecr-repo: demo-observability-api
      helm-repo: demo-observability-helm
      eks-cluster: demo-eks
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
